<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB Draft Pick - Display Overlay</title>
    <style>
        /* Mode display: bersih, transparan, tanpa scrollbar */
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: transparent !important;
        }
    </style>
</head>

<body>

    <!-- BAN ROW -->
    <div class="ban">
        <div class="teamnameblue team-name-banner">
            <div class="team-name-display" id="teamNameDisplay1">Blue Side</div>
        </div>

        <div style="flex-grow: 1;"></div>

        <div class="ban1">
            <div id="image-display-6" class="image-display"></div>
        </div>
        <div class="ban1">
            <div id="image-display-7" class="image-display"></div>
        </div>
        <div class="ban1">
            <div id="image-display-8" class="image-display"></div>
        </div>
        <div class="ban1">
            <div id="image-display-9" class="image-display"></div>
        </div>
        <div class="ban1">
            <div id="image-display-10" class="image-display"></div>
        </div>

        <!-- <div class="header-text-1-standalone" id="headerText1Container">
            <div id="headerText1">BO 3 GAME 1</div>
        </div> -->

        <div class="top-empty-bar ad-space" id="topEmptyBar"></div>

        <!-- <div class="header-text-2-standalone" id="headerText2Container">
            <div id="headerText2">MATCH 4</div>
        </div> -->

        <div class="ban1">
            <div id="image-display-20" class="image-display"></div>
        </div>
        <div class="ban1">
            <div id="image-display-19" class="image-display"></div>
        </div>
        <div class="ban1">
            <div id="image-display-18" class="image-display"></div>
        </div>
        <div class="ban1">
            <div id="image-display-17" class="image-display"></div>
        </div>
        <div class="ban1">
            <div id="image-display-16" class="image-display"></div>
        </div>

        <div style="flex-grow: 1;"></div>

        <div class="teamnamered team-name-banner">
            <div class="team-name-display" id="teamNameDisplay2">Red Side</div>
        </div>

    </div>

    <!-- PICK ROW -->
    <div class="pick">
        <!-- Blue Side Picks 1–5 -->
        <div class="pick1">
            <div class="nameholder">
                <h2></h2>
                <div id="outputContainer">
                    <p id="output1"></p>
                </div>
            </div>
            <div id="image-display-1" class="image-display"></div>
        </div>

        <div class="pick1">
            <div class="nameholder">
                <h2></h2>
                <div id="outputContainer">
                    <p id="output2"></p>
                </div>
            </div>
            <div id="image-display-2" class="image-display"></div>
        </div>

        <div class="pick1">
            <div class="nameholder">
                <h2></h2>
                <div id="outputContainer">
                    <p id="output3"></p>
                </div>
            </div>
            <div id="image-display-3" class="image-display"></div>
        </div>

        <div class="pick1">
            <div class="nameholder">
                <h2></h2>
                <div id="outputContainer">
                    <p id="output4"></p>
                </div>
            </div>
            <div id="image-display-4" class="image-display"></div>
        </div>

        <div class="pick1">
            <div class="nameholder">
                <h2></h2>
                <div id="outputContainer">
                    <p id="output5"></p>
                </div>
            </div>
            <div id="image-display-5" class="image-display"></div>
        </div>

        <!-- KOTAK INFO & TIMER -->
        <div class="tournamentinfo">
            <div class="top-row">
                <div class="score-bars left" id="scoreBarsLeft"></div>
                <div class="phase-status" id="phaseStatus">BANNING</div>
                <div class="score-bars right" id="scoreBarsRight"></div>
            </div>

            <div class="timer-columns">
                <div class="center-col-logo left">
                    <div class="image-container">
                        <img id="image1" src="" alt="Logo Blue"> 
                    </div>
                </div>

                <div class="center-col-timer">
                    <div id="greenTriangleCenter" class="green-triangle center"></div>
                    <div class="timer-row">
                        <div id="greenTriangleLeft" class="green-triangle left"></div>
                        <div class="countdown-number" id="countdownTimer">39</div>
                        <div id="greenTriangleRight" class="green-triangle right"></div>
                    </div>
                </div>

                <div class="center-col-logo right">
                    <div class="image-container">
                        <img id="image2" src="" alt="Logo Red">
                    </div>
                </div>
            </div>
        </div>

        <!-- Red Side Picks 15–11 (urutan terbalik) -->
        <div class="pick1">
            <div class="nameholder">
                <h2></h2>
                <div id="outputContainer">
                    <p id="output10"></p>
                </div>
            </div>
            <div id="image-display-15" class="image-display"></div>
        </div>

        <div class="pick1">
            <div class="nameholder">
                <h2></h2>
                <div id="outputContainer">
                    <p id="output9"></p>
                </div>
            </div>
            <div id="image-display-14" class="image-display"></div>
        </div>

        <div class="pick1">
            <div class="nameholder">
                <h2></h2>
                <div id="outputContainer">
                    <p id="output8"></p>
                </div>
            </div>
            <div id="image-display-13" class="image-display"></div>
        </div>

        <div class="pick1">
            <div class="nameholder">
                <h2></h2>
                <div id="outputContainer">
                    <p id="output7"></p>
                </div>
            </div>
            <div id="image-display-12" class="image-display"></div>
        </div>

        <div class="pick1">
            <div class="nameholder">
                <h2></h2>
                <div id="outputContainer">
                    <p id="output6"></p>
                </div>
            </div>
            <div id="image-display-11" class="image-display"></div>
        </div>

        <!-- BOTTOM TIMER THIN LINE -->
        <div id="bottomCollapseBar" class="bottom-thin-bar">
            <div id="bottomCollapseFill" class="bottom-thin-fill"></div>
        </div>

    </div>

</body>
<script src="config.js"></script>
<script src="display.js"></script>

</html>
